name: GitBack2Life encrypted inbox tests
on:
  pull_request:
    paths:
      - 'tools/gb2l-email/inbox-*.mjs'
      - 'tools/gb2l-email/receive*.mjs'
      - 'tools/gb2l-email/assistant_inbox_session.py'
      - 'tools/gb2l-email/INBOX_SETUP.md'
      - '.github/workflows/gb2l-inbox-*.yml'
permissions:
  contents: read
jobs:
  inbox-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare isolated Python crypto test environment
        run: |
          python3 -m venv /tmp/gb2l-inbox-python
          /tmp/gb2l-inbox-python/bin/pip install --disable-pip-version-check cryptography==46.0.4
      - name: Run inbox crypto and synthetic GitHub/Gmail regression tests
        env:
          PYTHON: /tmp/gb2l-inbox-python/bin/python
        run: node --test tools/gb2l-email/receive.test.mjs tools/gb2l-email/inbox-flow.test.mjs
      - name: Check new inbox JavaScript syntax
        run: |
          for file in tools/gb2l-email/inbox-*.mjs tools/gb2l-email/receive.mjs; do node --check "$file"; done
