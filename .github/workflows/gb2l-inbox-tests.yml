name: GitBack2Life encrypted inbox tests
on:
  pull_request:
    paths:
      - 'tools/gb2l-email/inbox-*.mjs'
      - 'tools/gb2l-email/receive*.mjs'
      - 'tools/gb2l-email/assistant_inbox_session.py'
      - 'tools/gb2l-email/INBOX_SETUP.md'
      - '.github/workflows/gb2l-inbox-*.yml'
permissions:
  contents: read
jobs:
  inbox-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare isolated Python crypto test environment
        run: |
          python3 -m venv /tmp/gb2l-inbox-python
          /tmp/gb2l-inbox-python/bin/pip install --disable-pip-version-check cryptography==46.0.4
      - name: Run inbox crypto and synthetic GitHub/Gmail regression tests
        env:
          PYTHON: /tmp/gb2l-inbox-python/bin/python
        run: node --test tools/gb2l-email/receive.test.mjs tools/gb2l-email/inbox-flow.test.mjs
      - name: Check new inbox JavaScript syntax
        run: |
          for file in tools/gb2l-email/inbox-*.mjs tools/gb2l-email/receive.mjs; do node --check "$file"; done
      - name: Verify local inbox reader imports
        run: node --input-type=module -e "await import('./tools/gb2l-email/inbox-local-read.mjs')"
      - name: Verify inbox package SHA-256 manifest
        run: |
          set -u
          failed=0
          while read -r expected path expected_bytes; do
            [ -n "$expected" ] || continue
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            actual_bytes="$(wc -c < "$path" | tr -d ' ')"
            if [ "$expected" != "$actual" ] || [ "$expected_bytes" != "$actual_bytes" ]; then
              echo "::error file=$path::Manifest mismatch: expected $expected / $expected_bytes bytes; got $actual / $actual_bytes bytes"
              failed=1
            fi
          done < SHA256_MANIFEST.txt
          exit "$failed"
