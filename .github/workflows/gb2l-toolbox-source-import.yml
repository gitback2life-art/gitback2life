name: Import verified 911 Toolbox source package
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: toolbox-source-import-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false
jobs:
  import-review-build:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'toolbox/archive-staging-20261022-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: Wait for the reviewed source ZIP upload
        if: hashFiles('.toolbox-source-import-payload/*.zip') == ''
        run: echo "Awaiting the single reviewed ZIP at .toolbox-source-import-payload/911_GitBack2Life_Email_Communications_Review_Build_20261020.zip."

      - name: Import only the pinned and manifest-verified 14-tool source archive
        if: hashFiles('.toolbox-source-import-payload/*.zip') != ''
        run: |
          set -euo pipefail
          if [ ! -d .toolbox-source-import-payload ]; then
            echo "No staging payload remains; import already completed or this PR has no import payload."
            exit 0
          fi
          python toolbox/911_gitback2life/import_source_package.py --payload-dir .toolbox-source-import-payload --destination toolbox/911_gitback2life/distribution --repo-root .
      - name: Commit the verified source files to this pull request branch
        if: hashFiles('toolbox/911_gitback2life/distribution/BUILD_MANIFEST.json') != ''
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ ! -d toolbox/911_gitback2life/distribution ]; then
            echo "Source import did not create a distribution."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .toolbox-source-import-payload toolbox/911_gitback2life/distribution toolbox/911_gitback2life/README.md toolbox/911_gitback2life/TOOLBOX_SOURCE_IMPORT_STATUS.md
          if git diff --cached --quiet; then
            echo "No source import changes to commit."
            exit 0
          fi
          git commit -m "Import verified 14-tool Toolbox source distribution"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
