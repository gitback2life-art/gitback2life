name: Deploy gitback2life site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare public site artifact
        run: |
          rm -rf site-dist
          mkdir -p site-dist
          cp index.html site-dist/
          cp -R assets site-dist/assets
          mkdir -p site-dist/projects/opportunity-tracker
          cp projects/opportunity-tracker/index.html site-dist/projects/opportunity-tracker/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
