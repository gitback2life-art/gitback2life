name: Deploy gitback2life site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare public site artifact
        run: |
          rm -rf site-dist
          mkdir -p site-dist
          cp index.html site-dist/
          cp -R assets site-dist/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
