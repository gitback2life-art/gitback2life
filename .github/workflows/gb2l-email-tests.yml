name: GitBack2Life email tests
on:
  pull_request:
  push:
    branches: [main, feat/gb2l-approved-email-sender-20261022]
permissions:
  contents: read
jobs:
  email-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test tools/gb2l-email/*.test.mjs
      - run: node toolbox/911_gitback2life/email_communications/github_actions_adapter/verify-bundle.mjs
      - run: for file in tools/gb2l-email/*.mjs; do node --check "$file"; done
