name: 💡 Suggest an Idea
description: Share an idea for something gitback2life could try, build, learn, or investigate.
title: "[IDEA] "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        ## Help shape the next step

        Thanks for contributing an idea. This project is intentionally built in public, so ideas submitted here may become part of the public project story.

        **Privacy note:** this is a public GitHub issue. Do not include your real name, address, phone number, medical records, passwords, financial information, or other private details.

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should gitback2life try, learn, build, or investigate?
      placeholder: "I think gitback2life should..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What area does this relate to?
      options:
        - Building software
        - Learning with AI
        - Getting more independent
        - Finding legitimate opportunities
        - Improving the website/project
        - Privacy or security
        - Something completely different
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why do you think it would help?
      description: A little context is enough.
      placeholder: "This could help because..."
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Optional links, examples, or details. Please keep private information out.
      placeholder: "Examples, references, or related projects..."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I understand this issue is public and I have not included private or identifying information.
          required: true
